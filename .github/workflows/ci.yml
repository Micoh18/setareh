name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Backend — typecheck y pruebas
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Obtener código
        uses: actions/checkout@v4
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Instalar dependencias bloqueadas
        run: npm ci
      - name: Auditar dependencias de producción
        run: npm audit --omit=dev
      - name: Verificar TypeScript
        run: npm run check
      - name: Ejecutar pruebas
        run: npm test

  documentation:
    name: Documentación — compilación estática
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs-site
    steps:
      - name: Obtener código
        uses: actions/checkout@v4
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: docs-site/package-lock.json
      - name: Instalar dependencias bloqueadas
        run: npm ci
      - name: Revisar que los docs no expongan secretos
        run: npm run check:public-content
      - name: Construir el portal
        run: npm run build
